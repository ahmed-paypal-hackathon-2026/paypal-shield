# NOTE: script_location is relative to the REPO ROOT; run alembic from there:
#   alembic -c backend/app/db/migrations/alembic.ini upgrade head
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# The URL is read at runtime from app.config settings (see env.py)
# and overrides this value.
sqlalchemy.url = sqlite+aiosqlite:///./shield.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
